name: HyperBEAM RNG

on:
  pull_request:
    paths:
      - 'v2/**'
      - '.github/workflows/hyperbeam-rng.yml'
  push:
    branches: [v2]
    paths:
      - 'v2/**'
      - '.github/workflows/hyperbeam-rng.yml'

permissions:
  contents: read

jobs:
  threshold-crypto:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - run: npm ci
      - name: Check operational JavaScript
        run: |
          node --check deploy/deploy.mjs
          node --check provider/ao.mjs
          node --check provider/bls.mjs
          node --check provider/daemon.mjs
      - name: Test threshold BLS and DKG
        run: node --test test/bls.test.mjs
